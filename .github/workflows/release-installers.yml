name: Release installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PROJECT: src/ApplicationFoundry/ApplicationFoundry.csproj

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --force-evaluate
      - run: dotnet test --configuration Release --no-restore

  windows:
    needs: test
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:APP_VERSION -o publish
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows\ApplicationFoundry.iss'
      - uses: actions/upload-artifact@v7
        with:
          name: application-foundry-windows
          path: artifacts/*.exe
          if-no-files-found: error

  windows-desktop-prototype:
    if: github.event_name != 'push'
    needs: test
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/ApplicationFoundry.Desktop/ApplicationFoundry.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:APP_VERSION -o publish-desktop
      - shell: pwsh
        run: |
          $errorPath = Join-Path $env:RUNNER_TEMP 'application-foundry-desktop-self-test.stderr'
          $process = Start-Process -FilePath (Resolve-Path publish-desktop/ApplicationFoundry.Desktop.exe) -ArgumentList '--self-test' -RedirectStandardError $errorPath -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $errorPath) { Get-Content $errorPath | Select-Object -First 30 }
            throw "Desktop startup self-test failed with exit code $($process.ExitCode)"
          }
      - shell: pwsh
        run: ./tests/packaging/assert-windows-gui-subsystem.ps1 publish-desktop/ApplicationFoundry.Desktop.exe
      - run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging\windows\ApplicationFoundry.Desktop.iss'
      - shell: pwsh
        run: ./tests/packaging/assert-windows-gui-subsystem.ps1 (Get-ChildItem artifacts/*-windows-desktop-prototype-setup.exe).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: application-foundry-windows-desktop-prototype
          path: artifacts/*-windows-desktop-prototype-setup.exe
          if-no-files-found: error

  macos:
    needs: test
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            runtime: osx-x64
          - runner: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish "$PROJECT" -c Release -r '${{ matrix.runtime }}' --self-contained true -p:PublishSingleFile=true -p:Version="$APP_VERSION" -o publish
      - name: Build pkg
        run: |
          mkdir -p package-root/usr/local/lib/application-foundry package-root/usr/local/bin artifacts
          cp -R publish/. package-root/usr/local/lib/application-foundry/
          chmod +x package-root/usr/local/lib/application-foundry/ApplicationFoundry
          ln -s ../lib/application-foundry/ApplicationFoundry package-root/usr/local/bin/application-foundry
          pkgbuild --root package-root --identifier com.yourfoxprodeveloper.application-foundry --version "$APP_VERSION" "artifacts/ApplicationFoundry-${APP_VERSION}-${{ matrix.runtime }}.pkg"
      - uses: actions/upload-artifact@v7
        with:
          name: application-foundry-${{ matrix.runtime }}
          path: artifacts/*.pkg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ needs.test.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish "$PROJECT" -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:Version="$APP_VERSION" -o publish
      - name: Check Rocky 8 SQLite compatibility
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          symbols = subprocess.check_output(
              ["readelf", "--version-info", "publish/libe_sqlite3.so"], text=True
          )
          versions = {
              tuple(map(int, match.groups()))
              for match in re.finditer(r"GLIBC_(\d+)\.(\d+)", symbols)
          }
          if not versions or max(versions) > (2, 28):
              raise SystemExit(f"SQLite native library needs GLIBC {max(versions, default='unknown')}; Rocky 8 has 2.28")
          PY
      - name: Smoke-test published app from a different directory
        shell: bash
        run: |
          export ApplicationFoundry__DataDirectory="$RUNNER_TEMP/application-foundry-smoke"
          export ASPNETCORE_URLS="http://127.0.0.1:51829"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/publish/ApplicationFoundry" > "$RUNNER_TEMP/application-foundry-smoke.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if [[ "$(curl --silent "$ASPNETCORE_URLS/health")" == Healthy ]]; then
              break
            fi
            sleep 1
          done
          test -f "$ApplicationFoundry__DataDirectory/app.db"
          curl --fail --silent --output /dev/null "$ASPNETCORE_URLS/"
          curl --fail --silent --output /dev/null "$ASPNETCORE_URLS/app.css"
      - name: Build deb and rpm
        run: |
          sudo apt-get update && sudo apt-get install -y ruby-dev rpm
          sudo gem install --no-document fpm
          mkdir -p package-root/usr/lib/application-foundry package-root/usr/bin artifacts
          cp -R publish/. package-root/usr/lib/application-foundry/
          chmod +x package-root/usr/lib/application-foundry/ApplicationFoundry
          ln -s ../lib/application-foundry/ApplicationFoundry package-root/usr/bin/application-foundry
          fpm -s dir -t deb -n application-foundry -v "$APP_VERSION" -C package-root -p "artifacts/application-foundry_${APP_VERSION}_amd64.deb" .
          fpm -s dir -t rpm -n application-foundry -v "$APP_VERSION" -C package-root -p "artifacts/application-foundry-${APP_VERSION}-1.x86_64.rpm" .
      - uses: actions/upload-artifact@v7
        with:
          name: application-foundry-linux
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: application-foundry-*
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
